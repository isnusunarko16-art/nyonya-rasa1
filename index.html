<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B1E2E">
<title>NYONYA RASA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="layarLogin" class="layar" hidden>
  <div class="merek"><h1>NYONYA RASA</h1><p>Manajemen Usaha</p></div>
  <form id="formLogin" class="kartu" autocomplete="off">
    <div id="blokUrl">
      <label for="inUrl">Alamat server (berakhiran /exec)</label>
      <input id="inUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <label for="inUser">Username</label>
    <input id="inUser" type="text" autocapitalize="none" autocorrect="off">
    <label for="inPin">PIN</label>
    <input id="inPin" type="password" inputmode="numeric">
    <div id="errLogin" class="galat" hidden></div>
    <button id="btnMasuk" class="tombol" type="submit">Masuk</button>
    <button id="ubahUrl" class="tautan" type="button">Ubah alamat server</button>
  </form>
</section>

<div id="aplikasi" hidden>
  <header class="atas">
    <h1 id="judul">Dashboard</h1>
    <button id="btnMenu" class="ikon" aria-label="Menu">☰</button>
  </header>
  <main id="isi"></main>
  <nav id="nav" class="bawah">
    <a href="#dashboard" data-h="dashboard"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-4H4z"/></svg>Beranda</a>
    <a href="#produk" data-h="produk"><svg viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8"/></svg>Produk</a>
    <a href="#hpp" data-h="hpp"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M16 12h0M8 16h2M12 16h2"/></svg>HPP</a>
    <a href="#transaksi" data-h="transaksi"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h12"/></svg>Transaksi</a>
    <a href="#laporan" data-h="laporan"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Laporan</a>
  </nav>
  <div id="sheet" class="sheet" hidden>
    <div class="lembar"><div id="daftarMenu"></div></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
